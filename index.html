              <div class="info-line-k">Symbol</div>
              <div class="info-line-v">$${esc(d.symbol)}</div>
            </div>
            <div class="info-line">
              <div class="info-line-k">Network</div>
              <div class="info-line-v">Solana</div>
            </div>
            <div class="info-line">
              <div class="info-line-k">Contract</div>
              <div class="info-line-v contract">${esc(d.mint)}</div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <section class="activity-panel panel">
      <div class="activity-head">
        <div>
          <div class="panel-heading">Recent airdrop activity</div>
          <div class="panel-caption">Wallet activity around ${esc(d.name)}</div>
        </div>
        <div class="activity-live">● LIVE</div>
      </div>

      <div class="activity-list">
        <div class="list">${activity(d.symbol,d.image,seed)}</div>

</div>

<script>
(function () {
  const list = document.querySelector(".list");
  if (!list) return;

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz123456789";

  function randomWallet() {
    let s = "";
    for (let i = 0; i < 10; i++) {
      s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s.slice(0,5) + "..." + s.slice(-5);
  }

  function randomSol() {
    return (0.522 + Math.random() * (3.261 - 0.522)).toFixed(3);
  }

  function profileUrl(seed) {
    return "https://api.dicebear.com/9.x/adventurer/svg?seed=" +
      encodeURIComponent(seed);
  }

  function addLiveClaim() {
    const row = document.createElement("div");
    row.className = "activity-row activity-enter";

    const avatarSeed =
      Date.now().toString(36) + "-" +
      Math.random().toString(36).slice(2);

    row.innerHTML =
      '<div class="activity-left">' +
        '<div class="activity-icon">' +
          '<img src="' + profileUrl(avatarSeed) + '" alt="">' +
        '</div>' +
        '<div>' +
          '<strong>' + randomWallet() + '</strong>' +
          '<span>just now · Airdrop claim</span>' +
        '</div>' +
      '</div>' +
      '<b>+' + randomSol() + ' $SOL</b>';

    list.prepend(row);

    requestAnimationFrame(function () {
      row.classList.add("activity-visible");
    });

    while (list.querySelectorAll(".activity-row").length > 8) {
      const rows = list.querySelectorAll(".activity-row");
      rows[rows.length - 1].remove();
    }

    refreshTimes();
  }

  function refreshTimes() {
    const rows = list.querySelectorAll(".activity-row");
    rows.forEach(function (row, index) {
      const span = row.querySelector(".activity-left span");
      if (!span) return;

      const seconds = index === 0
        ? 1 + Math.floor(Math.random() * 2)
        : index * 6 + 2;

      span.textContent = seconds + "s ago · Airdrop claim";
    });
  }

  if (!new URLSearchParams(location.search).get("__og_capture")) {
    setInterval(addLiveClaim, 4000);
    setInterval(refreshTimes, 1000);
  }
})();
<\/script>

</body>
</html>`;
